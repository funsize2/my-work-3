name: Match Sync

on:
  repository_dispatch:
    types: [trigger-sync]
  workflow_dispatch:

concurrency:
  group: internal-sync-group
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run Scraper
        env:
          GAME_SERVER_API: ${{ secrets.GAME_SERVER_API }}
          RUN_TIMES: ${{ secrets.RUN_TIMES }}
          WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
          P_PASS: ${{ secrets.P_PASS }}
          LOOP_DURATION: ${{ secrets.LOOP_DURATION }}
          DELTA_L1: ${{ secrets.DELTA_L1 }}
          DELTA_H1: ${{ secrets.DELTA_H1 }}
          DELTA_L2: ${{ secrets.DELTA_L2 }}
          DELTA_H2: ${{ secrets.DELTA_H2 }}
          WIN_SHIFT: ${{ secrets.WIN_SHIFT }}
          BACKOFF_MIN: ${{ secrets.BACKOFF_MIN }}
          BACKOFF_MAX: ${{ secrets.BACKOFF_MAX }}
          SRC_1_PREFIX: ${{ secrets.SRC_1_PREFIX }}
          SRC_1_M_CLASS: ${{ secrets.SRC_1_M_CLASS }}
          SRC_1_S_CLASS: ${{ secrets.SRC_1_S_CLASS }}
          SRC_2_CONTAINER: ${{ secrets.SRC_2_CONTAINER }}
          SRC_3_CONTAINER: ${{ secrets.SRC_3_CONTAINER }}
          SRC_4_CLASS: ${{ secrets.SRC_4_CLASS }}
          SRC_5_GRID: ${{ secrets.SRC_5_GRID }}
        run: python match_sync.py
